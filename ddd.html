<body>

<h1>🧠 Memory Game</h1>
<p id="status">Moves: 0</p>
<div class="game-board" id="gameBoard"></div>
<button onclick="startGame()">Restart</button>

<script>
  const emojis = ['🍎','🍌','🍇','🍉','🍓','🍒','🥝','🍍'];
  let cards = [];
  let firstCard = null;
  let secondCard = null;
  let lockBoard = false;
  let moves = 0;

  function shuffle(array) {
    return array.sort(() => Math.random() - 0.5);
  }

  function startGame() {
    const gameBoard = document.getElementById('gameBoard');
    gameBoard.innerHTML = '';
    moves = 0;
    document.getElementById('status').textContent = "Moves: 0";

    const doubled = [...emojis, ...emojis];
    cards = shuffle(doubled).map((emoji, index) => {
      return { id: index, emoji, matched: false };
    });

    cards.forEach(card => {
      const div = document.createElement('div');
      div.classList.add('card');
      div.dataset.id = card.id;
      div.innerHTML = '';
      div.addEventListener('click', () => handleClick(div, card));
      gameBoard.appendChild(div);
    });
  }

  function handleClick(element, card) {
    if (lockBoard || element.classList.contains('revealed') || card.matched) return;

    element.classList.add('revealed');
    element.textContent = card.emoji;

    if (!firstCard) {
      firstCard = { element, card };
    } else {
      secondCard = { element, card };
      moves++;
      document.getElementById('status').textContent = "Moves: " + moves;
      checkMatch();
    }
  }

  function checkMatch() {
    if (firstCard.card.emoji === secondCard.card.emoji) {
      firstCard.card.matched = true;
      secondCard.card.matched = true;

      firstCard.element.classList.add('matched');
      secondCard.element.classList.add('matched');

      resetTurn();
      checkWin();
    } else {
      lockBoard = true;
      setTimeout(() => {
        firstCard.element.classList.remove('revealed');
        secondCard.element.classList.remove('revealed');
        firstCard.element.textContent = '';
        secondCard.element.textContent = '';
        resetTurn();
      }, 800);
    }
  }

  function resetTurn() {
    firstCard = null;
    secondCard = null;
    lockBoard = false;
  }

  function checkWin() {
    if (cards.every(c => c.matched)) {
      document.getElementById('status').textContent = "🎉 You won in " + moves + " moves!";
    }
  }

  startGame();
</script>

</body>
</html>
